{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'dashboard/board.css' %}">
</head>
<body>
<header class="bar">
  <h1>Live orders</h1>
  <div class="meta"><a href="{% url 'dashboard:reports' %}">Reports</a><span id="today"></span><span id="conn" class="conn" role="status">Connecting</span></div>
</header>
<main id="board" class="board" aria-live="polite"
      data-feed="{% url 'dashboard:orders-board-feed' %}"
      data-advance="{% url 'dashboard:orders-advance' reference='__ref__' %}"
      data-poll="{{ poll_seconds }}" data-ws="{{ ws_url }}"></main>
<div id="toast" class="toast" role="alert" hidden></div>
<script src="{% static 'dashboard/board.js' %}" defer></script>
</body>
</html>
